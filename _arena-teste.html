<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arena — banco de ensaio (motor Fabula Ultima)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
  /* O banco de ensaio corre a arena NOVA sem login, sem energia e sem
     nada gravado: seis avatares feitos na hora e o motor verdadeiro a
     resolver a batalha.

     Deixou de fingir. A versão anterior deste arquivo desenhava orbes
     escritos à mão ("Ferrões Salinos · envenena") e um lance de mentira
     para se poder OLHAR para o palco. Servia enquanto não havia motor
     novo; agora há, e um banco que finge não prova nada.

     NÃO se força o font-size: a escala vem do css/base.css, que dá 16px
     no telemóvel e 26,4px a partir dos 681px. Forçar a segunda fazia o
     ensaio mentir justamente no caso que mais interessa medir. */
  body { background: #04030a; margin: 0; height: 100vh; overflow: hidden; }
  #combateModal { opacity: 1 !important; pointer-events: all !important; }
  #ensaio {
    position: fixed; right: 0.5rem; top: 0.5rem; z-index: 999;
    display: flex; gap: 0.25rem; font-family: 'Cinzel', serif; font-size: 0.4375rem;
  }
  #ensaio button {
    background: rgba(201,168,76,.15); color: #c9a84c; cursor: pointer;
    border: 1px solid rgba(201,168,76,.4); border-radius: 0.25rem; padding: 0.25rem 0.5rem;
    font-family: inherit; font-size: inherit;
  }
</style>
</head><body>

<div id="combateModal" class="open"></div>
<div id="ensaio">
  <button onclick="ensaioNova()">nova batalha</button>
  <button onclick="ensaioLendaria()">lendários</button>
  <button onclick="ensaioPM()">encher PM</button>
  <button onclick="ensaioFerir()">ferir</button>
  <button onclick="ensaioFim()">acabar</button>
</div>

<script>
var _z = Date.now();
for (const f of ["css/base.css", "css/ui.css", "css/screen.css", "css/combate.css",
                 "css/combate-batalha.css", "css/combate-arena.css"])
  document.write('<link rel="stylesheet" href="' + f + '?z=' + _z + '">');
/* A pilha NOVA e só ela: nada de ficha-3dt, magias, vantagens ou
   combate-3dt. Se alguma coisa da arena nova precisar de um deles, é
   porque ficou agarrada ao motor antigo — e é melhor rebentar aqui do
   que descobri-lo no dia da troca. */
for (const f of ["js/i18n.js", "js/i18n-misc.js", "js/i18n-arena-fu.js",
                 "js/data.js", "js/identidade.js", "js/cores.js", "js/nascimento.js",
                 "js/raridade.js",
                 "js/ficha-fu.js", "js/vantagens-fu.js", "js/combate-fu.js",
                 "js/magias-fu.js", "js/arena-fu.js"])
  document.write('<scr' + 'ipt src="' + f + '?z=' + _z + '"><\/scr' + 'ipt>');
</script>

<script>
const NOMES_EU  = ['Brama, a Nobre', 'Ísen, o Desastrado', 'Vurel'];
const NOMES_INI = ['Lâmina Oca', 'Arauto da Cinza', 'Coisa sem Nome'];

/* Um avatar com a forma que o fuFicha espera: seed, nível e a certidão
   com o DNA. É a mesma forma que o slot gravado tem — o motor não sabe
   distinguir este de um do jogo, e é por isso que o ensaio vale. */
function _bicho(nome, nivel, i) {
  const seed = Math.floor(Math.random() * 2e9);
  return {
    id: 'e' + i + '_' + seed,
    nome, seed, nivel,
    nascimento: { seed, dna: gerarDna('Comum', seed) },
  };
}

let _nivelEu = 15, _nivelIni = 12;

function ensaioNova() {
  afAbrir(
    NOMES_EU.map((n, i)  => _bicho(n, _nivelEu, i)),
    NOMES_INI.map((n, i) => _bicho(n, _nivelIni, i + 3)),
    Math.floor(Math.random() * 2e9)
  );
}

/* Nível 30 dos dois lados: é aí que as magias abrem todas (Lendário =
   degrau 3) e que a Devastação e o Despertar aparecem no menu. */
function ensaioLendaria() {
  _nivelEu = 30; _nivelIni = 30;
  ensaioNova();
}

function ensaioPM() {
  if (!_afE) return;
  _afE.A.concat(_afE.B).forEach(c => { c.pm = c.ficha.pmMax; });
  _afDesenhar();
}

/* Metade da vida a toda a gente: é a forma mais rápida de ver a crise,
   a Misericórdia, a Fúria da Crise e o Voo Baixo a cair. */
function ensaioFerir() {
  if (!_afE) return;
  _afE.A.concat(_afE.B).forEach(c => { c.pv = Math.max(1, Math.floor(c.ficha.crise * 0.9)); });
  _afDesenhar();
}

function ensaioFim() {
  if (!_afE) return;
  _afE.B.forEach(c => { c.pv = 0; c.vivo = false; });
  _afE.acabou = true; _afE.vencedor = 'A';
  _afDesenhar();
}

window.addEventListener('load', ensaioNova);
</script>
</body></html>
